      drink: `<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" class="food-svg"><rect width="320" height="220" fill="#D5ECE6"/><path d="M178 24 L162 110" stroke="#E0532C" stroke-width="7" stroke-linecap="round"/><path d="M112 68 L208 68 L194 182 C192 187 177 190 160 190 C143 190 128 187 126 182 Z" fill="rgba(255,255,255,0.65)" stroke="#FFFFFF" stroke-width="2.5"/><path d="M116 84 L204 84 L191 178 C189 183 176 186 160 186 C144 186 131 183 129 178 Z" fill="#D97926"/><circle cx="192" cy="78" r="14" fill="#F8D23A" stroke="#FFF8D2" stroke-width="2"/></svg>`
    };

    // Pure-JS ISO 18004 QR SVG Generator (Byte mode, ECC M, Ver 1..6)
    const QR = (() => {
      const GF_EXP = new Uint8Array(512), GF_LOG = new Uint8Array(256);
      let x = 1;
      for (let i = 0; i < 255; i++) { GF_EXP[i] = x; GF_LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
      for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
      const mul = (a, b) => (a && b) ? GF_EXP[GF_LOG[a] + GF_LOG[b]] : 0;
      const rsPoly = (n) => {
        let p = [1];
        for (let i = 0; i < n; i++) {
          const nx = new Array(p.length + 1).fill(0);
          for (let j = 0; j < p.length; j++) { nx[j] ^= p[j]; nx[j + 1] ^= mul(p[j], GF_EXP[i]); }
          p = nx;
        }
        return p;
      };
      const rs = (data, ecLen) => {
        const g = rsPoly(ecLen), res = new Uint8Array(data.length + ecLen);
        res.set(data);
        for (let i = 0; i < data.length; i++) {
          const c = res[i];
          if (c) for (let j = 0; j < g.length; j++) res[i + j] ^= mul(g[j], c);
        }
        return res.slice(data.length);
      };
      const VER = { 1:[26,10,1,16], 2:[44,16,1,28], 3:[70,26,1,44], 4:[100,18,2,32], 5:[134,24,2,43], 6:[172,16,4,27] };
      const ALIGN = { 1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30], 6:[6,34] };
      const FMT = [0x5412,0x5125,0x5e7c,0x5b4b,0x45f9,0x40ce,0x4f97,0x4aa0];
      const svg = (text, px = 160) => {
        const bytes = new TextEncoder().encode(String(text)).slice(0, 106);
        let ver = 1;
        while (ver < 6 && Math.ceil((12 + bytes.length * 8) / 8) > VER[ver][2] * VER[ver][3]) ver++;
        const [, ecLen, nb, dpb] = VER[ver];
        const cap = nb * dpb, bits = [];
        const push = (v, l) => { for (let i = l - 1; i >= 0; i--) bits.push((v >> i) & 1); };
        push(4, 4); push(bytes.length, 8);
        bytes.forEach((b) => push(b, 8));
        push(0, Math.min(4, cap * 8 - bits.length));
        while (bits.length % 8) bits.push(0);
        for (let i = 0; bits.length < cap * 8; i++) push(i % 2 ? 0x11 : 0xec, 8);
        const db = new Uint8Array(cap);
        for (let i = 0; i < cap; i++) { let v = 0; for (let b = 0; b < 8; b++) v = (v << 1) | bits[i * 8 + b]; db[i] = v; }
        const blks = [], ecb = [];
        for (let i = 0; i < nb; i++) { const b = db.slice(i * dpb, (i + 1) * dpb); blks.push(b); ecb.push(rs(b, ecLen)); }
        const cw = [];
        for (let i = 0; i < dpb; i++) blks.forEach((b) => cw.push(b[i]));
        for (let i = 0; i < ecLen; i++) ecb.forEach((e) => cw.push(e[i]));
        const sz = ver * 4 + 17;
        const m = Array.from({ length: sz }, () => new Int8Array(sz).fill(-1));
        const fn = Array.from({ length: sz }, () => new Uint8Array(sz));
        const sf = (r, c, v) => { if (r >= 0 && r < sz && c >= 0 && c < sz) { m[r][c] = v ? 1 : 0; fn[r][c] = 1; } };
        const finder = (r0, c0) => {
          for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
            const b = r === -1 || r === 7 || c === -1 || c === 7;
            const o = r === 0 || r === 6 || c === 0 || c === 6;
            const inn = r >= 2 && r <= 4 && c >= 2 && c <= 4;
            sf(r0 + r, c0 + c, !b && (o || inn));
          }
        };
        finder(0, 0); finder(0, sz - 7); finder(sz - 7, 0);
        for (const r of ALIGN[ver]) for (const c of ALIGN[ver]) {
          if (fn[r][c] || (r <= 8 && c <= 8) || (r <= 8 && c >= sz - 9) || (r >= sz - 9 && c <= 8)) continue;
          for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) sf(r + dr, c + dc, Math.max(Math.abs(dr), Math.abs(dc)) === 2 || (!dr && !dc));
        }
        for (let i = 8; i < sz - 8; i++) { if (!fn[6][i]) sf(6, i, i % 2 === 0); if (!fn[i][6]) sf(i, 6, i % 2 === 0); }
        sf(sz - 8, 8, 1);
        for (let i = 0; i <= 8; i++) { fn[8][i] = 1; fn[i][8] = 1; }
        for (let i = sz - 8; i < sz; i++) { fn[8][i] = 1; fn[i][8] = 1; }
        const dbits = []; cw.forEach((v) => { for (let b = 7; b >= 0; b--) dbits.push((v >> b) & 1); });
        let bi = 0, up = true;
        for (let col = sz - 1; col > 0; col -= 2) {
          if (col === 6) col--;
          for (let i = 0; i < sz; i++) {
            const r = up ? sz - 1 - i : i;
            for (let dc = 0; dc < 2; dc++) if (!fn[r][col - dc]) m[r][col - dc] = bi < dbits.length ? dbits[bi++] : 0;
          }
          up = !up;
        }
        const pred = (r, c) => (r + c) % 2 === 0;
        for (let r = 0; r < sz; r++) for (let c = 0; c < sz; c++) if (!fn[r][c] && pred(r, c)) m[r][c] ^= 1;
        const fmt = FMT[0];
        const c1 = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
        const c2 = [[sz-1,8],[sz-2,8],[sz-3,8],[sz-4,8],[sz-5,8],[sz-6,8],[sz-7,8],[8,sz-8],[8,sz-7],[8,sz-6],[8,sz-5],[8,sz-4],[8,sz-3],[8,sz-2],[8,sz-1]];
        for (let i = 0; i < 15; i++) { const b = (fmt >> (14 - i)) & 1; m[c1[i][0]][c1[i][1]] = b; m[c2[i][0]][c2[i][1]] = b; }
        const tot = sz + 6;
        let rects = "";
        for (let r = 0; r < sz; r++) for (let c = 0; c < sz; c++) if (m[r][c] === 1) rects += `<rect x="${c + 3}" y="${r + 3}" width="1" height="1" fill="#1F1B18"/>`;
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${tot} ${tot}" width="${px}" height="${px}" shape-rendering="crispEdges"><rect width="${tot}" height="${tot}" fill="#FFF" rx="1"/>${rects}</svg>`;
      };
      return { svg };
    })();

      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          cb(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function createOrder(mode, pay, extra = {}) {
      syncBusinessDay();
      const total = ui.cart.reduce((s, c) => s + c.price * c.qty, 0);
      if (total <= 0) return;
      let paid = mode === "pos";
      let status = mode === "pos" ? (ui.instant ? "completed" : "preparing") : "waiting_payment";
      if (pay === "punch_card") {
        const card = store.punchCards.find((p) => p.code === extra.code);
        const need = Math.ceil(total / 50);
        if (!card || card.left < need) return toast(`식권 횟수가 부족합니다 (필요 ${need}칸)`, false);
        card.left -= need;
        paid = true;
      }
      const ord = {
        id: "o_" + Math.random().toString(36).slice(2, 9),
        date: getManilaDate(),
        num: nextOrderNum(ui.branchId),
        branchId: ui.branchId,
        mode,
        table: mode === "pos" ? "Counter" : "Kiosk",
        items: ui.cart.map((c) => ({ ...c })),
        total,
        pay,
        paid,
        status,
        ts: Date.now(),
      };
      store.orders.push(ord);
      saveStore();
      ui.cart = [];
      ui.tender = 0;
      ui.lastOrder = ord;
      render();
      toast(`주문 #${ord.num} (${php(ord.total)}) 등록 완료!`);
      return ord;
    }

        <div class="receipt-58">
          <div style="text-align:center;border-bottom:1px dashed #000;padding-bottom:6px;margin-bottom:6px;">
            <strong>ORDER SLIP ONLY</strong><br><small>NOT AN OFFICIAL BIR INVOICE</small><br>
            <strong>${esc(store.shopName)}</strong><br>
            <div style="font-size:18px;font-weight:900;margin:4px 0;">#${ord.num}</div>
          </div>
          ${ord.items.map((i) => `<div style="display:flex;justify-content:space-between;"><span>${esc(i.en)} x${i.qty}</span><span>${php(i.price*i.qty)}</span></div>`).join("")}
          <div style="border-top:1px dashed #000;margin-top:6px;padding-top:6px;font-weight:900;display:flex;justify-content:space-between;">

          ${ord.total>=500 ? `<div style="border:1px solid #000;padding:3px;margin-top:6px;font-size:10px;text-align:center;">BIR ₱500+ : Issue manual Sales Invoice if requested</div>` : ""}
        </div>`);

    function bindAppEvents() {

      document.querySelectorAll("[data-kfilter]").forEach((b) => b.addEventListener("click", () => { ui.kioskFilter = b.dataset.kfilter; render(); }));
      document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { ui.lang = b.dataset.lang; render(); }));
      document.querySelectorAll("[data-tender]").forEach((b) => b.addEventListener("click", () => { ui.tender = Number(b.dataset.tender); render(); }));
      if (el("btn-go-menu")) el("btn-go-menu").addEventListener("click", () => { ui.tab = "admin"; ui.adminSubTab = "menu"; render(); });
      document.querySelectorAll("[data-padd]").forEach((b) => b.addEventListener("click", () => { const m = store.menus.find((x)=>x.id===b.dataset.padd); if (m) addCart(m); }));
      document.querySelectorAll("[data-kadd]").forEach((b) => b.addEventListener("click", () => { const m = store.menus.find((x)=>x.id===b.dataset.kadd); if (m) addCart(m); }));
      document.querySelectorAll("[data-qminus]").forEach((b) => b.addEventListener("click", () => {
        const c = ui.cart.find((x) => x.key === b.dataset.qminus);
        if (c) { c.qty -= 1; if (c.qty <= 0) ui.cart = ui.cart.filter((x) => x.key !== b.dataset.qminus); render(); }
      }));
      document.querySelectorAll("[data-qplus]").forEach((b) => b.addEventListener("click", () => {
        const c = ui.cart.find((x) => x.key === b.dataset.qplus);
        if (c) { c.qty += 1; render(); }
      }));
      document.querySelectorAll("[data-slip]").forEach((b) => b.addEventListener("click", () => {
        const o = store.orders.find((x) => x.id === b.dataset.slip);
        if (o) showSlipModal(o);
      }));
      document.querySelectorAll("[data-void]").forEach((b) => b.addEventListener("click", () => {
        const o = store.orders.find((x) => x.id === b.dataset.void);
        if (!o) return;
        o.voidReq = true;
        store.voidRequests.push({ id: "vr_" + Math.random().toString(36).slice(2,7), date: getManilaDate(), orderId: o.id, branchId: o.branchId, num: o.num, total: o.total, reason: "직원 오입력/미수령 취소요청", status: "pending" });
        saveStore(); render(); toast("사장님 대시보드(PIN)로 취소 승인 요청이 전송되었습니다!");
      }));
      document.querySelectorAll("[data-kpay]").forEach((b) => b.addEventListener("click", () => {
        const o = store.orders.find((x) => x.id === b.dataset.kpay);
        if (o) { o.paid = true; o.pay = b.dataset.pm; o.status = "preparing"; saveStore(); render(); toast(`#${o.num} 결제확인 → 조리 시작!`); }
      }));
      document.querySelectorAll("[data-knext]").forEach((b) => b.addEventListener("click", () => {
        const o = store.orders.find((x) => x.id === b.dataset.knext);
        if (o) { o.status = b.dataset.st; saveStore(); render(); }
      }));

      if (el("btn-clear-cart")) el("btn-clear-cart").addEventListener("click", () => { ui.cart = []; ui.tender = 0; render(); });
      if (el("chk-inst")) el("chk-inst").addEventListener("change", (e) => { ui.instant = e.target.checked; });
      if (el("pos-cash")) el("pos-cash").addEventListener("click", () => createOrder("pos", "cash"));
      if (el("pos-gcash")) el("pos-gcash").addEventListener("click", () => createOrder("pos", "gcash"));
      if (el("pos-card")) el("pos-card").addEventListener("click", () => createOrder("pos", "card"));
      if (el("pos-punch")) el("pos-punch").addEventListener("click", () => {
        const cards = store.punchCards.filter((p) => p.branchId === ui.branchId);
        openModal(`
          <h3 class="font-extrabold mb-2">🎫 단골 식권 선택</h3>
          ${cards.map((p) => `<button data-usepc="${esc(p.code)}" class="w-full py-2 px-3 rounded-xl border mb-1-5 flex justify-between text-xs font-bold"><span>${esc(p.code)} (${esc(p.student)})</span><span>${p.left}/${p.total}칸</span></button>`).join("") || `<p class="text-xs text-muted mb-2">발급된 식권이 없습니다.</p>`}

        el("m-close").addEventListener("click", closeModal);
        document.querySelectorAll("[data-usepc]").forEach((pb) => pb.addEventListener("click", () => { closeModal(); createOrder("pos", "punch_card", { code: pb.dataset.usepc }); }));
      });
      if (el("btn-pc-modal")) el("btn-pc-modal").addEventListener("click", () => {
        openModal(`
          <h3 class="font-extrabold mb-2">🎫 단골 식권 발급 (₱200 = 4칸 / ₱500 = 10칸)</h3>

          <button id="btn-save-pc" class="w-full py-2-5 rounded-xl bg-gold text-white font-extrabold text-sm">식권 발급하기</button>`);
        el("btn-save-pc").addEventListener("click", () => {
          const st = el("new-pc-name").value.trim() || "Student";
          const pkg = Number(el("new-pc-pkg").value);
          const code = "PC-" + (101 + store.punchCards.length);
          store.punchCards.push({ code, date: getManilaDate(), branchId: ui.branchId, student: st, pkg, total: pkg/50, left: pkg/50, pay: "cash" });
          saveStore(); closeModal(); render(); toast(`식권 ${code} 발급 완료!`);
        });
      });

      if (el("btn-kiosk-new")) el("btn-kiosk-new").addEventListener("click", () => { ui.lastOrder = null; render(); });
      if (el("kiosk-cash")) el("kiosk-cash").addEventListener("click", () => createOrder("kiosk", "cash"));
      if (el("kiosk-card")) el("kiosk-card").addEventListener("click", () => createOrder("kiosk", "card"));
      if (el("kiosk-gcash")) el("kiosk-gcash").addEventListener("click", () => {
        const ord = createOrder("kiosk", "gcash");
        if (!ord) return;
        openModal(`
          <div class="text-center space-y-3">
            <span class="text-xs font-extrabold bg-blue-soft text-blue px-3 py-1 rounded-full">PayMongo Dynamic QR Ph</span>
            <h3 class="text-lg font-black">주문 #${ord.num} · ${php(ord.total)}</h3>
            <div class="inline-block p-3 bg-sand rounded-2xl">${QR.svg(`PH.PAYMONGO.QRPH|${ord.id}|${ord.total}`, 180)}</div>
            <button id="sim-pm-ok" class="w-full py-3 rounded-xl bg-green text-white font-extrabold text-xs">⚡ PayMongo 자동입금 시뮬레이션 (직원확인 없이 바로 주방전송!)</button>
            <button id="m-close" class="w-full py-2 rounded-xl bg-sand text-xs font-bold">닫기</button>
          </div>`);
        el("m-close").addEventListener("click", closeModal);
        el("sim-pm-ok").addEventListener("click", () => {
          ord.paid = true; ord.status = "preparing"; saveStore(); closeModal(); render(); toast(`#${ord.num} 동적 QR 입금 확인 → 주방 자동 전송!`);
        });
      });

      document.querySelectorAll(".cls-den").forEach((inp) => inp.addEventListener("input", () => {
        let sum = 0;
        document.querySelectorAll(".cls-den").forEach((d) => { sum += Number(d.dataset.cden) * Math.max(0, Number(d.value || 0)); });
        el("cls-total").textContent = php(sum);
      }));
      if (el("btn-cls-submit")) el("btn-cls-submit").addEventListener("click", () => {
        const staff = el("cls-staff").value.trim();
        if (!staff) return toast("직원 이름을 입력하세요.", false);
        let cash = 0;
        document.querySelectorAll(".cls-den").forEach((d) => { cash += Number(d.dataset.cden) * Math.max(0, Number(d.value || 0)); });
        const rem = {};
        document.querySelectorAll(".cls-rem").forEach((r) => { rem[r.dataset.crem] = Number(r.value || 0); });
        store.closeouts.push({ date: getManilaDate(), branchId: ui.branchId, staff, cash, rem, ts: Date.now() });
        saveStore();
        toast("블라인드 마감 제출 완료! (차액은 📊 사장님 감시 탭에서 확인)");
      });

      if (el("btn-adm-login")) el("btn-adm-login").addEventListener("click", () => {
        if (el("adm-pin").value === store.pin) { ui.adminUnlocked = true; render(); }

      if (el("adm-date")) el("adm-date").addEventListener("change", (e) => { ui.adminDate = e.target.value || getManilaDate(); render(); });
      document.querySelectorAll("[data-asub]").forEach((b) => b.addEventListener("click", () => { ui.adminSubTab = b.dataset.asub; render(); }));

      if (el("nm-img-file")) el("nm-img-file").addEventListener("change", (e) => {

      if (el("btn-wipe-today")) el("btn-wipe-today").addEventListener("click", () => {

    });
    document.getElementById("btn-lock-kiosk").addEventListener("click", () => { ui.locked = true; render(); });
    document.getElementById("btn-unlock-kiosk").addEventListener("click", () => {
      openModal(`
        <h3 class="font-extrabold mb-2">🔓 화면 잠금 해제 (PIN: 7777)</h3>
        <input id="unl-pin" type="password" value="" placeholder="••••" class="w-full border rounded-xl px-3 py-2 text-center text-xl num mb-3" />
        <button id="btn-do-unl" class="w-full py-2-5 rounded-xl bg-red text-white font-bold">해제</button>`);
      document.getElementById("btn-do-unl").addEventListener("click", () => {
        if (document.getElementById("unl-pin").value === store.pin) { ui.locked = false; closeModal(); render(); }
        else toast("PIN 오류", false);
      });
    });

    setInterval(() => {
      if (syncBusinessDay()) render();
    }, 30000);

    render();
  })();
  </script>
</body>
</html>
